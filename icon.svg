<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(253,230,138,0.55)"/>
      <stop offset="60%" style="stop-color:rgba(253,230,138,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(253,230,138,0)"/>
    </radialGradient>
    <radialGradient id="halo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(249,168,212,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(249,168,212,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Soft outer glow -->
  <ellipse cx="256" cy="256" rx="200" ry="190" fill="url(#halo2)"/>

  <!-- Inner warm halo around text -->
  <ellipse cx="256" cy="256" rx="155" ry="145" fill="url(#halo)"/>

  <!-- Rays emanating from center — long thin lines -->
  <g stroke="#fde68a" stroke-linecap="round" opacity="0.7">
    <!-- Top -->
    <line x1="256" y1="108" x2="256" y2="52"  stroke-width="4.5"/>
    <!-- Top-right -->
    <line x1="318" y1="126" x2="358" y2="82"  stroke-width="3.5"/>
    <!-- Right -->
    <line x1="360" y1="200" x2="418" y2="188" stroke-width="3.5"/>
    <!-- Bottom-right -->
    <line x1="348" y1="310" x2="400" y2="346" stroke-width="3"/>
    <!-- Bottom -->
    <line x1="256" y1="360" x2="256" y2="420" stroke-width="4"/>
    <!-- Bottom-left -->
    <line x1="164" y1="310" x2="112" y2="346" stroke-width="3"/>
    <!-- Left -->
    <line x1="152" y1="200" x2="94"  y2="188" stroke-width="3.5"/>
    <!-- Top-left -->
    <line x1="194" y1="126" x2="154" y2="82"  stroke-width="3.5"/>
  </g>

  <!-- Short sparkle rays between main rays -->
  <g stroke="#fde68a" stroke-linecap="round" opacity="0.35">
    <line x1="290" y1="100" x2="308" y2="68"  stroke-width="2.5"/>
    <line x1="345" y1="155" x2="375" y2="130" stroke-width="2.5"/>
    <line x1="370" y1="255" x2="408" y2="248" stroke-width="2.5"/>
    <line x1="316" y1="345" x2="342" y2="376" stroke-width="2.5"/>
    <line x1="222" y1="100" x2="204" y2="68"  stroke-width="2.5"/>
    <line x1="167" y1="155" x2="137" y2="130" stroke-width="2.5"/>
    <line x1="142" y1="255" x2="104" y2="248" stroke-width="2.5"/>
    <line x1="196" y1="345" x2="170" y2="376" stroke-width="2.5"/>
  </g>

  <!-- 4 corner sparkle dots -->
  <g fill="#fde68a" opacity="0.6">
    <circle cx="108" cy="108" r="4"/>
    <circle cx="404" cy="108" r="4"/>
    <circle cx="108" cy="404" r="3"/>
    <circle cx="404" cy="404" r="3"/>
  </g>

  <!-- GY text -->
  <text x="256" y="306" font-size="188" font-weight="700" text-anchor="middle"
    font-family="system-ui, sans-serif" fill="white" letter-spacing="-6"
    style="filter:drop-shadow(0 0 18px rgba(253,230,138,0.6))">GY</text>

  <!-- Subtle underline -->
  <rect x="148" y="328" width="216" height="5" rx="2.5" fill="rgba(253,230,138,0.4)"/>
</svg>
